[project]
name = "orch"
version = "0.1.0"
description = "Minimal GitHub issue to pull request orchestrator for containerized coding agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
