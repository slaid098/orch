[project]
name = "orch"
version = "0.1.0"
description = "Minimal GitHub issue to pull request orchestrator for containerized coding agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
live = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --cov=orch --cov-report=term-missing --cov-report=xml:coverage.xml"
markers = [
    "unit: fast tests without external services",
    "integration: tests with real local components",
    "live: tests against external services, not run in CI",
]

[tool.coverage.run]
branch = true
source = ["orch"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
